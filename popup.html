<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Desktop Pets</title>
  <style>
    body {
      width: 600px;
      max-height: 700px;
      min-height: 500px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow-y: auto;
    }
    
    .header {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }
    
    h1 {
      margin: 0;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .subtitle {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 5px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 14px;
      opacity: 0.8;
    }
    
    .controls {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .toggle-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .toggle {
      width: 50px;
      height: 26px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 13px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .toggle.active {
      background: #4CAF50;
    }
    
    .toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    
    .toggle.active .toggle-slider {
      transform: translateX(24px);
    }
    
    .stats {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 20px;
    }
    
    .category {
      margin-bottom: 20px;
    }
    
    .category h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 600;
    }
    
    .pet-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    
    .pet-item {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    
    .pet-item:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }
    
    .pet-item.active {
      background: rgba(76, 175, 80, 0.3);
      border-color: #4CAF50;
    }
    
    .pet-item img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    
    .pet-name {
      font-size: 9px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: capitalize;
    }
    
    .pet-count {
      position: absolute;
      top: 5px;
      right: 5px;
      background: #4CAF50;
      color: white;
      border-radius: 10px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
    }
    
    .footer {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    
    .button {
      background: rgba(244, 67, 54, 0.3);
      border: 1px solid rgba(244, 67, 54, 0.5);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      transition: all 0.2s;
    }
    
    .button:hover {
      background: rgba(244, 67, 54, 0.5);
    }
    
    .help {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 10px;
      line-height: 1.5;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }
    
    .search-bar {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.15);
    }
    
    .search-input {
      width: 100%;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    
    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    
    .search-input:focus {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .species-count {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      opacity: 0.8;
      background: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span>🐾</span>
      <span>Desktop Pets</span>
    </h1>
    <div class="subtitle">Synchronized across all tabs!</div>
  </div>
  
  <div class="controls">
    <div class="toggle-section">
      <span>Enabled</span>
      <div class="toggle active" id="toggle-enabled">
        <div class="toggle-slider"></div>
      </div>
      <div id="toggle-label" style="position: absolute; opacity: 0; cursor: pointer; width: 100%; height: 100%; top: 0; left: 0;"></div>
    </div>
    <div class="stats">
      Active: <strong id="total-count">0</strong> pets
    </div>
  </div>
  
  <div class="search-bar">
    <input type="text" class="search-input" id="search" placeholder="🔍 Search pets..." />
  </div>
  
  <div class="species-count">
    Showing <strong id="shown-count">0</strong> / <strong id="species-count">0</strong> species
  </div>
  
  <div class="content">
    <div id="species-grid">
      <div class="loading">🐾 Loading all 43 species...</div>
    </div>
  </div>
  
  <div class="footer">
    <button class="button" id="remove-all">🗑️ Remove All Pets</button>
    <div class="help">
      💡 Left-click to add • Right-click to remove
    </div>
  </div>
  
  <script src="chrome-messaging.js"></script>
  <script src="species-manager.js"></script>
  <script src="popup-controller.js"></script>
</body>
</html>
